security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "bcrypt"

  providers:
    user_provider:
      entity:
        class: App\Model\Entity\User
        property: username # ✔ IMPORTANT

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: user_provider

      form_login:
        login_path: auth_login
        check_path: auth_login
        username_parameter: username # ✔ IMPORTANT
        password_parameter: password
        enable_csrf: false # ✔ IMPORTANT pour les tests

      logout:
        path: auth_logout
        target: /

  access_control: []

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
